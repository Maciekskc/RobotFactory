name: CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: dotnet restore ./RobotFactoryDistriutedSystem/RobotFactoryDistributedSystem.sln

      - name: Build
        run: dotnet build ./RobotFactoryDistriutedSystem/RobotFactoryDistributedSystem.sln

      - name: Test with the dotnet CLI
        run: dotnet test ./RobotFactoryDistriutedSystem/RobotFactoryDistributedSystem.sln
